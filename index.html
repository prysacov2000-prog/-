<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fab">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
  <title>Собачки и кошечки</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff5f7;
      color: #4a2c3a;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ff8fab;
      color: #fff;
      padding: 14px 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }

    header h1 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 10px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .tab {
      flex: 1;
      max-width: 160px;
      padding: 10px 0;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      background: rgba(255,255,255,.25);
      color: #fff;
      transition: background .2s;
    }

    .tab.active {
      background: #fff;
      color: #ff5c8a;
    }

    main {
      padding: 12px;
      padding-bottom: 80px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      animation: pop .3s ease;
    }

    .card img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #ffe0e9;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 12px;
      background: linear-gradient(to top, rgba(255,245,247,1) 60%, rgba(255,245,247,0));
    }

    #more {
      padding: 12px 36px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      background: #ff5c8a;
      color: #fff;
      box-shadow: 0 4px 12px rgba(255,92,138,.4);
    }

    #more:disabled {
      opacity: .6;
    }

    .status {
      text-align: center;
      color: #b06a80;
      padding: 20px;
    }

    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .card img { height: 220px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🐶 Собачки и кошечки 🐱</h1>
    <nav class="tabs">
      <button class="tab active" id="tab-dogs">Собачки</button>
      <button class="tab" id="tab-cats">Кошечки</button>
    </nav>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <p class="status" id="status">Загружаем пушистиков…</p>
  </main>

  <footer>
    <button id="more">Ещё!</button>
  </footer>

  <script>
    const API = {
      dogs: async () => {
        const res = await fetch('https://dog.ceo/api/breeds/image/random/10');
        const data = await res.json();
        return data.message;
      },
      cats: async () => {
        const res = await fetch('https://api.thecatapi.com/v1/images/search?limit=10');
        const data = await res.json();
        return data.map(item => item.url);
      }
    };

    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const moreBtn = document.getElementById('more');
    const tabDogs = document.getElementById('tab-dogs');
    const tabCats = document.getElementById('tab-cats');

    let current = 'dogs';
    let loading = false;

    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.style.display = text ? 'block' : 'none';
    }

    async function loadPhotos() {
      if (loading) return;
      loading = true;
      moreBtn.disabled = true;
      statusEl.textContent = 'Загружаем пушистиков…';
      statusEl.style.display = 'block';
      try {
        const urls = await API[current]();
        urls.forEach(url => {
          const card = document.createElement('div');
          card.className = 'card';
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.alt = current === 'dogs' ? 'Собачка' : 'Кошечка';
          img.src = url;
          card.appendChild(img);
          grid.appendChild(card);
        });
      } catch (err) {
        setStatus('Не удалось загрузить фото. Проверь интернет и попробуй ещё 🙈');
        loading = false;
        moreBtn.disabled = false;
        return;
      }
      setStatus('');
      loading = false;
      moreBtn.disabled = false;
    }

    function switchTab(tab) {
      if (loading || tab === current) return;
      current = tab;
      tabDogs.classList.toggle('active', tab === 'dogs');
      tabCats.classList.toggle('active', tab === 'cats');
      grid.innerHTML = '';
      loadPhotos();
    }

    tabDogs.addEventListener('click', () => switchTab('dogs'));
    tabCats.addEventListener('click', () => switchTab('cats'));
    moreBtn.addEventListener('click', loadPhotos);

    loadPhotos();
  </script>
</body>
</html>
